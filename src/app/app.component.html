<app-header />

<main>
  <ul id="users">
    @for (item of users(); track item.id) {
      <li>
        <app-user [user]="item" (selectedUser)="onSelectUser($event)" />
      </li>
    } @empty {
      <li id="fallback">
        <span>Found 0 users.</span>
      </li>
    }
  </ul>

  @if (selectedUser()) {
    <app-tasks [user]="selectedUser()!" />
  }
</main>

<router-outlet />
